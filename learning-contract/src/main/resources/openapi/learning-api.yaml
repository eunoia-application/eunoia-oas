openapi: 3.0.0
info:
  title: Learning API
  description: >-
    Учебное ядро Eunoia — канонический граф знаний (Neo4j) + персональный оверлей мастерства
    (garden, Postgres). Чтение графа, отметка владения словами и garden-view (структура × статус).
  version: 2.2.0
  contact:
    name: Eunoia Team
    url: https://github.com/eunoia-application
tags:
  - name: Learning
    description: Граф знаний и прогресс пользователя
security:
  - bearerAuth: []
paths:
  /learning/lexemes/{id}:
    get:
      summary: Карточка слова (с моим статусом мастерства)
      operationId: getLexeme
      tags: [Learning]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "en:go:VERB"
      responses:
        '200':
          description: Слово с формами, переводами, связями и моим статусом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LexemeCard' }
        '404':
          description: Слово не найдено

  /learning/search:
    get:
      summary: Поиск слов по префиксу леммы
      operationId: searchLexemes
      tags: [Learning]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Найденные слова
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LexemeRef' }

  /learning/topics:
    get:
      summary: Корневые темы (верх дерева)
      operationId: getTopicRoots
      tags: [Learning]
      responses:
        '200':
          description: Верхний уровень тем
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TopicRef' }

  /learning/topics/{id}:
    get:
      summary: Ветка сада — слова темы с моей раскраской
      operationId: getTopicView
      tags: [Learning]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Тема и её слова со статусом мастерства
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicView' }
        '404':
          description: Тема не найдена

  /learning/grammar/{id}:
    get:
      summary: Грамматическое правило
      operationId: getGrammar
      tags: [Learning]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Правило
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarView' }
        '404':
          description: Правило не найдено

  /learning/mastery:
    get:
      summary: Мой прогресс (что отмечено)
      operationId: getMyMastery
      tags: [Learning]
      responses:
        '200':
          description: Отметки мастерства
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MasteryView' }

  /learning/mastery/{lexemeId}:
    put:
      summary: Отметить владение словом (знаю/учу/не знаю)
      operationId: setMastery
      tags: [Learning]
      parameters:
        - name: lexemeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MasteryRequest' }
      responses:
        '200':
          description: Обновлённая отметка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasteryView' }

components:
  schemas:
    PartOfSpeech:
      type: string
      enum: [NOUN, VERB, ADJECTIVE, ADVERB, PRONOUN, PREPOSITION, CONJUNCTION, DETERMINER, INTERJECTION, NUMERAL, OTHER]
    Cefr:
      type: string
      enum: [A1, A2, B1, B2, C1, C2]
    MasteryStatus:
      type: string
      enum: [KNOWN, LEARNING, UNKNOWN]
      description: Статус владения. Отсутствие отметки трактуем как UNKNOWN.

    Form:
      type: object
      required: [text]
      properties:
        text: { type: string, example: "went" }
        feature: { type: string, nullable: true, example: "past" }
    Translation:
      type: object
      required: [text, lang]
      properties:
        text: { type: string, example: "идти" }
        lang: { type: string, example: "ru" }

    LexemeRef:
      type: object
      required: [id, lemma]
      properties:
        id: { type: string, example: "en:go:VERB" }
        lemma: { type: string, example: "go" }
        pos: { $ref: '#/components/schemas/PartOfSpeech' }

    LexemeCard:
      type: object
      required: [id, lemma, status]
      properties:
        id: { type: string, example: "en:go:VERB" }
        lemma: { type: string }
        pos: { $ref: '#/components/schemas/PartOfSpeech' }
        cefr: { $ref: '#/components/schemas/Cefr' }
        freqRank: { type: integer, nullable: true }
        forms:
          type: array
          items: { $ref: '#/components/schemas/Form' }
        translations:
          type: array
          items: { $ref: '#/components/schemas/Translation' }
        synonyms:
          type: array
          items: { $ref: '#/components/schemas/LexemeRef' }
        antonyms:
          type: array
          items: { $ref: '#/components/schemas/LexemeRef' }
        hypernyms:
          type: array
          items: { $ref: '#/components/schemas/LexemeRef' }
        status:
          $ref: '#/components/schemas/MasteryStatus'

    GardenLeaf:
      type: object
      description: Слово-лист в теме с моим статусом — из этого фронт красит сад.
      required: [id, lemma, status]
      properties:
        id: { type: string }
        lemma: { type: string }
        pos: { $ref: '#/components/schemas/PartOfSpeech' }
        cefr: { $ref: '#/components/schemas/Cefr' }
        status: { $ref: '#/components/schemas/MasteryStatus' }

    TopicRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }

    TopicView:
      type: object
      required: [topic]
      properties:
        topic: { $ref: '#/components/schemas/TopicRef' }
        lexemes:
          type: array
          items: { $ref: '#/components/schemas/GardenLeaf' }

    GrammarView:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        cefr: { $ref: '#/components/schemas/Cefr' }

    MasteryRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/MasteryStatus' }

    MasteryView:
      type: object
      required: [lexemeId, status]
      properties:
        lexemeId: { type: string }
        status: { $ref: '#/components/schemas/MasteryStatus' }
        updatedAt: { type: string, format: date-time }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
