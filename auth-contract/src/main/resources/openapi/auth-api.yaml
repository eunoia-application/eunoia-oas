openapi: 3.0.0
info:
  title: Auth API
  description: Authentication and authorization for Eunoia Application
  version: 1.0.0
  contact:
    name: Eunoia Team
    url: https://github.com/eunoia-application
tags:
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: User profile management
paths:
  /auth/register:
    post:
      summary: Register new user
      operationId: register
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        400:
          description: Bad Request - Invalid registration data
        409:
          description: Conflict - User already exists

  /auth/login:
    post:
      summary: Authenticate user
      operationId: login
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        401:
          description: Unauthorized - Invalid credentials
        400:
          description: Bad Request

  /auth/refresh:
    post:
      summary: Refresh access token
      operationId: refreshToken
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        200:
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        401:
          description: Unauthorized - Invalid refresh token

  /auth/logout:
    post:
      summary: Logout user (invalidate tokens)
      operationId: logout
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        204:
          description: Logout successful
        401:
          description: Unauthorized

  /auth/verify-email:
    post:
      summary: Verify user email
      operationId: verifyEmail
      tags:
        - Auth
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Email verification token
      responses:
        200:
          description: Email verified successfully
        400:
          description: Invalid or expired token

  /auth/forgot-password:
    post:
      summary: Request password reset
      operationId: forgotPassword
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        202:
          description: Password reset email sent
        404:
          description: User not found

  /auth/reset-password:
    post:
      summary: Reset password with token
      operationId: resetPassword
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: Password reset successful
        400:
          description: Invalid token or password

  /users/me:
    get:
      summary: Get current user profile
      operationId: getCurrentUser
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        200:
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        401:
          description: Unauthorized

    put:
      summary: Update current user profile
      operationId: updateCurrentUser
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        200:
          description: User profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        400:
          description: Bad Request
        401:
          description: Unauthorized

  /users/me/password:
    put:
      summary: Change password
      operationId: changePassword
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        204:
          description: Password changed successfully
        400:
          description: Bad Request - Invalid current password
        401:
          description: Unauthorized

  /users/{userId}:
    get:
      summary: Get user public profile
      operationId: getUserProfile
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: User public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublicProfile'
        404:
          description: User not found

components:
  schemas:
    # === Authentication Schemas ===
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - username
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        password:
          type: string
          format: password
          minLength: 8
          description: User password
          example: "SecurePass123!"
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Username (alphanumeric, dashes, underscores)
          example: "eunoia_user"
        firstName:
          type: string
          maxLength: 50
          description: First name
          example: "Alex"
        lastName:
          type: string
          maxLength: 50
          description: Last name
          example: "Johnson"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        password:
          type: string
          format: password
          description: User password
          example: "SecurePass123!"

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          description: Password reset token
        newPassword:
          type: string
          format: password
          minLength: 8
          description: New password

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          description: Current password
        newPassword:
          type: string
          format: password
          minLength: 8
          description: New password

    AuthResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: Refresh token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          enum: [Bearer]
          default: Bearer
          description: Token type
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 3600
        user:
          $ref: '#/components/schemas/UserProfile'

    # === User Schemas ===
    UserProfile:
      type: object
      required:
        - id
        - email
        - username
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
          example: "user@example.com"
        username:
          type: string
          example: "eunoia_user"
        firstName:
          type: string
          nullable: true
          example: "Alex"
        lastName:
          type: string
          nullable: true
          example: "Johnson"
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: User avatar URL
          example: "https://api.eunoia.app/avatars/user123.jpg"
        bio:
          type: string
          maxLength: 500
          nullable: true
          description: User biography
          example: "Digital garden enthusiast and knowledge management explorer"
        emailVerified:
          type: boolean
          description: Whether email is verified
          default: false
        stats:
          $ref: '#/components/schemas/UserStats'
        settings:
          $ref: '#/components/schemas/UserSettings'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    UserPublicProfile:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true
        stats:
          $ref: '#/components/schemas/UserPublicStats'
        createdAt:
          type: string
          format: date-time

    UserUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        avatarUrl:
          type: string
          format: uri
        bio:
          type: string
          maxLength: 500

    UserStats:
      type: object
      properties:
        noteCount:
          type: integer
          description: Total number of notes created
          example: 42
        tagCount:
          type: integer
          description: Total number of tags created
          example: 15
        evergreenNoteCount:
          type: integer
          description: Number of notes in EVERGREEN status
          example: 12
        lastActiveAt:
          type: string
          format: date-time
          description: Last active timestamp
          example: "2024-01-15T10:30:00Z"

    UserPublicStats:
      type: object
      properties:
        noteCount:
          type: integer
        evergreenNoteCount:
          type: integer

    UserSettings:
      type: object
      properties:
        theme:
          type: string
          enum: [LIGHT, DARK, AUTO]
          default: AUTO
          description: UI theme preference
        defaultNoteStatus:
          type: string
          enum: [DRAFT, SPROUT]
          default: DRAFT
          description: Default status for new notes
        emailNotifications:
          type: boolean
          default: true
          description: Email notifications enabled
        aiSuggestionsEnabled:
          type: boolean
          default: true
          description: AI suggestions enabled

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication

security:
  - bearerAuth: []