openapi: 3.0.0
info:
  title: Auth API
  description: Authentication and authorization for Eunoia (Design B — auth owns identity only)
  version: 2.2.0
  contact:
    name: Eunoia Team
    url: https://github.com/eunoia-application
tags:
  - name: Auth
    description: Authentication and account lifecycle
paths:
  /auth/register:
    post:
      summary: Register new user
      operationId: register
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        400:
          description: Bad Request - Invalid registration data
        409:
          description: Conflict - User already exists

  /auth/login:
    post:
      summary: Authenticate user
      operationId: login
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        401:
          description: Unauthorized - Invalid credentials
        400:
          description: Bad Request

  /auth/refresh:
    post:
      summary: Refresh access token
      operationId: refreshToken
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        200:
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        401:
          description: Unauthorized - Invalid refresh token

  /auth/logout:
    post:
      summary: Logout user (invalidate tokens)
      operationId: logout
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        204:
          description: Logout successful
        401:
          description: Unauthorized

  /auth/verify-email:
    post:
      summary: Verify user email
      operationId: verifyEmail
      tags:
        - Auth
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Email verification token
      responses:
        200:
          description: Email verified successfully
        400:
          description: Invalid or expired token

  /auth/forgot-password:
    post:
      summary: Request password reset
      operationId: forgotPassword
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        202:
          description: Password reset email sent
        404:
          description: User not found

  /auth/reset-password:
    post:
      summary: Reset password with token
      operationId: resetPassword
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: Password reset successful
        400:
          description: Invalid token or password

  /auth/account:
    delete:
      summary: Delete current account
      description: >
        Удаляет учётную запись (identity) и отзывает токены, затем публикует событие
        UserDeleted — по нему service-user и остальные сервисы удаляют свои данные.
      operationId: deleteAccount
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        204:
          description: Account deletion accepted; profile and data are removed asynchronously
        401:
          description: Unauthorized

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - username
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        password:
          type: string
          format: password
          minLength: 8
          description: User password
          example: "SecurePass123!"
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Username (alphanumeric, dashes, underscores)
          example: "eunoia_user"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        password:
          type: string
          format: password
          description: User password
          example: "SecurePass123!"

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          description: Password reset token
        newPassword:
          type: string
          format: password
          minLength: 8
          description: New password

    AuthResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: Refresh token
        tokenType:
          type: string
          enum: [Bearer]
          default: Bearer
          description: Token type
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
          example: 3600
        user:
          $ref: '#/components/schemas/AuthUser'

    # Слим-идентичность в ответе auth (Design B). Полный профиль (имя, аватар, био,
    # настройки, статистика) — в user-contract, у service-user. Имя схемы отличается
    # от user-contract UserProfile, чтобы не коллизить в общем npm-бандле типов.
    AuthUser:
      type: object
      required:
        - id
        - email
        - username
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
          example: "user@example.com"
        username:
          type: string
          example: "eunoia_user"
        emailVerified:
          type: boolean
          description: Whether email is verified
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication

security:
  - bearerAuth: []
