openapi: 3.0.0
info:
  title: Notes API
  description: Digital notes and thoughts management for Eunoia
  version: 1.0.0
  contact:
    name: Eunoia Team
    url: https://github.com/eunoia-application
tags:
  - name: Notes
    description: Digital notes and thoughts management
paths:
  /notes:
    post:
      summary: Create a new note
      operationId: createNote
      tags:
        - Notes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreationRequest'
      responses:
        201:
          description: Note created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        400:
          description: Bad Request - Invalid note data
        401:
          description: Unauthorized

    get:
      summary: Get filtered list of notes
      operationId: getNotes
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SPROUT, EVERGREEN]
          description: Filter by note status
        - name: tag
          in: query
          schema:
            type: string
          description: Filter by tag name
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search in note title and content
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
          description: Filter by creation date from
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
          description: Filter by creation date to
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt, title]
            default: updatedAt
          description: Sort field
        - name: sortDirection
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
          description: Sort direction
      responses:
        200:
          description: Paginated list of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalItems:
                    type: integer
                  totalPages:
                    type: integer
                  hasNext:
                    type: boolean
                  hasPrevious:
                    type: boolean
        401:
          description: Unauthorized

  /notes/{noteId}:
    get:
      summary: Get note by ID
      operationId: getNoteById
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Note details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteDetail'
        404:
          description: Note not found
        401:
          description: Unauthorized

    put:
      summary: Update note
      operationId: updateNote
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdateRequest'
      responses:
        200:
          description: Note updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        400:
          description: Bad Request
        404:
          description: Note not found
        401:
          description: Unauthorized

    delete:
      summary: Delete note
      operationId: deleteNote
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Note deleted successfully
        404:
          description: Note not found
        401:
          description: Unauthorized

  /notes/{noteId}/ai-suggestions:
    get:
      summary: Get AI suggestions for note connections
      operationId: getAISuggestions
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
          description: Maximum number of suggestions
      responses:
        200:
          description: List of AI suggestions for connecting notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AISuggestion'
        404:
          description: Note not found
        401:
          description: Unauthorized

  /notes/{noteId}/backlinks:
    get:
      summary: Get backlinks for a note
      operationId: getNoteBacklinks
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: List of notes that link to this note
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        404:
          description: Note not found
        401:
          description: Unauthorized

  /notes/{noteId}/tags:
    put:
      summary: Update tags for a note
      operationId: updateNoteTags
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteTagsUpdateRequest'
      responses:
        200:
          description: Note tags updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        404:
          description: Note not found
        401:
          description: Unauthorized

  /notes/batch:
    post:
      summary: Create multiple notes
      operationId: createNotesBatch
      tags:
        - Notes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotesBatchCreationRequest'
      responses:
        201:
          description: Notes created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        400:
          description: Bad Request
        401:
          description: Unauthorized

components:
  schemas:
    NoteCreationRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Note title
          example: "Thoughts on Digital Gardens"
        content:
          type: string
          description: Note content in Markdown format
          example: |
            # Digital Gardens
            
            A digital garden is a personal knowledge management system
            that emphasizes interconnected thoughts and continuous growth.
            
            ## Key Principles
            
            1. **Interconnection** - Ideas are linked together
            2. **Growth** - Notes evolve over time
            3. **Context** - Understanding through connections
        tags:
          type: array
          items:
            type: string
          description: List of tag names
          example: ["philosophy", "productivity", "digital-garden"]
        status:
          type: string
          enum: [DRAFT, SPROUT, EVERGREEN]
          default: DRAFT
          description: Initial status of the note

    NoteUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Note title
        content:
          type: string
          description: Note content in Markdown format
        status:
          type: string
          enum: [DRAFT, SPROUT, EVERGREEN]
          description: New status of the note

    NoteTagsUpdateRequest:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            type: string
          description: List of tag names
          example: ["knowledge-management", "tools", "personal-growth"]

    NotesBatchCreationRequest:
      type: object
      required:
        - notes
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/NoteCreationRequest'
          maxItems: 50
          description: List of notes to create

    Note:
      type: object
      required:
        - id
        - title
        - content
        - status
        - authorId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          description: Note title
          example: "Thoughts on Digital Gardens"
        content:
          type: string
          description: Note content in Markdown format
        excerpt:
          type: string
          description: Auto-generated excerpt (first 200 characters)
          example: "A digital garden is a personal knowledge management system that emphasizes interconnected thoughts and continuous growth..."
        status:
          type: string
          enum: [DRAFT, SPROUT, EVERGREEN]
          description: Note status
          example: "SPROUT"
        tags:
          type: array
          items:
            type: string
          description: Tag names associated with the note
          example: ["philosophy", "digital-garden"]
        authorId:
          type: string
          format: uuid
          example: "98765432-e89b-12d3-a456-426614174000"
        wordCount:
          type: integer
          description: Number of words in the note
          example: 450
        linkCount:
          type: integer
          description: Number of links to other notes
          example: 3
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    NoteDetail:
      allOf:
        - $ref: '#/components/schemas/Note'
        - type: object
          properties:
            backlinks:
              type: array
              items:
                $ref: '#/components/schemas/NoteLink'
              description: Notes that link to this note
            outgoingLinks:
              type: array
              items:
                $ref: '#/components/schemas/NoteLink'
              description: Notes that this note links to
            aiSuggestions:
              type: array
              items:
                $ref: '#/components/schemas/AISuggestion'
              description: AI-generated suggestions for connections
            version:
              type: integer
              description: Optimistic locking version
              example: 1

    NoteLink:
      type: object
      properties:
        noteId:
          type: string
          format: uuid
        title:
          type: string
        excerpt:
          type: string
        status:
          type: string
          enum: [DRAFT, SPROUT, EVERGREEN]
        linkType:
          type: string
          enum: [REFERENCE, RELATED, CONTRASTS]
          description: Type of connection

    AISuggestion:
      type: object
      required:
        - noteId
        - title
        - reason
        - confidence
      properties:
        noteId:
          type: string
          format: uuid
          example: "11111111-e89b-12d3-a456-426614174000"
        title:
          type: string
          example: "Personal Knowledge Management Tools"
        reason:
          type: string
          description: AI-generated explanation for the suggestion
          example: "Both notes discuss knowledge management systems and organization techniques. The suggested note provides concrete tool recommendations that complement the theoretical concepts in your note."
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: AI confidence score (0-1)
          example: 0.87
        connectionType:
          type: string
          enum: [RELATED, EXPANDS, CONTRASTS]
          description: Suggested type of connection
          example: "EXPANDS"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication

security:
  - bearerAuth: []