openapi: 3.0.0
info:
  title: Tags API
  description: Note categorization and tagging system for Eunoia
  version: 1.0.0
  contact:
    name: Eunoia Team
    url: https://github.com/eunoia-application
tags:
  - name: Tags
    description: Note categorization and tagging
paths:
  /tags:
    get:
      summary: Get all tags with statistics
      operationId: getTags
      tags:
        - Tags
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
        - name: search
          in: query
          schema:
            type: string
          description: Search tags by name
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, createdAt, noteCount]
            default: name
          description: Sort field
        - name: sortDirection
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
          description: Sort direction
      responses:
        200:
          description: Paginated list of tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagWithStats'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalItems:
                    type: integer
                  totalPages:
                    type: integer
                  hasNext:
                    type: boolean
                  hasPrevious:
                    type: boolean
        401:
          description: Unauthorized
        400:
          description: Bad Request

    post:
      summary: Create a new tag
      operationId: createTag
      tags:
        - Tags
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreationRequest'
      responses:
        201:
          description: Tag created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        400:
          description: Bad Request - Invalid tag data
        409:
          description: Conflict - Tag already exists
        401:
          description: Unauthorized

  /tags/{tagId}:
    get:
      summary: Get tag by ID with statistics
      operationId: getTagById
      tags:
        - Tags
      security:
        - bearerAuth: []
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Tag details with statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagWithStats'
        404:
          description: Tag not found
        401:
          description: Unauthorized

    put:
      summary: Update tag
      operationId: updateTag
      tags:
        - Tags
      security:
        - bearerAuth: []
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdateRequest'
      responses:
        200:
          description: Tag updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        404:
          description: Tag not found
        400:
          description: Bad Request
        401:
          description: Unauthorized

    delete:
      summary: Delete tag
      operationId: deleteTag
      tags:
        - Tags
      security:
        - bearerAuth: []
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Tag deleted successfully
        404:
          description: Tag not found
        401:
          description: Unauthorized
        400:
          description: Bad Request - Cannot delete tag with notes

  /tags/{tagId}/notes:
    get:
      summary: Get notes by tag
      operationId: getNotesByTag
      tags:
        - Tags
      security:
        - bearerAuth: []
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        200:
          description: List of notes with this tag
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        excerpt:
                          type: string
                        status:
                          type: string
                          enum: [DRAFT, SPROUT, EVERGREEN]
                        createdAt:
                          type: string
                          format: date-time
                  page:
                    type: integer
                  totalItems:
                    type: integer
        404:
          description: Tag not found
        401:
          description: Unauthorized

components:
  schemas:
    TagCreationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Tag name (alphanumeric, dashes, underscores)
          example: "digital-garden"
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Tag color in hex format
          example: "#2E8B57"
          default: "#6B7280"
        description:
          type: string
          maxLength: 255
          description: Tag description
          example: "Topics related to digital gardens and personal knowledge management"

    TagUpdateRequest:
      type: object
      properties:
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Tag color in hex format
        description:
          type: string
          maxLength: 255
          description: Tag description

    Tag:
      type: object
      required:
        - id
        - name
        - color
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "digital-garden"
        color:
          type: string
          example: "#2E8B57"
        description:
          type: string
          nullable: true
        authorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    TagWithStats:
      allOf:
        - $ref: '#/components/schemas/Tag'
        - type: object
          properties:
            noteCount:
              type: integer
              description: Number of notes with this tag
              example: 42
            usageTrend:
              type: number
              format: float
              description: Usage trend compared to last period (-1 to 1)
              example: 0.15
            lastUsedAt:
              type: string
              format: date-time
              nullable: true
              description: When this tag was last used
            isSystem:
              type: boolean
              description: Whether this is a system tag
              default: false

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication

security:
  - bearerAuth: []