name: 🚀 Deploy Contracts with UI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      modules:
        description: 'Modules to deploy'
        required: true
        type: choice
        options:
          - all
          - core
          - api-only
      confirm:
        description: 'Type "DEPLOY" to confirm'
        required: true
        type: string
        default: ''

jobs:
  validate:
    if: inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        run: echo "✅ Deployment confirmed!"

      - name: Log deployment info
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Modules: ${{ inputs.modules }}"
          echo "Triggered by: ${{ github.actor }}"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Determine modules to deploy
        id: modules
        run: |
          if [ "${{ inputs.modules }}" = "all" ]; then
            echo "MODULES=shared-contract notes-contract tags-contract auth-contract" >> $GITHUB_OUTPUT
            echo "ORDERED=true" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.modules }}" = "core" ]; then
            echo "MODULES=shared-contract notes-contract" >> $GITHUB_OUTPUT
            echo "ORDERED=true" >> $GITHUB_OUTPUT
          else
            echo "MODULES=notes-contract tags-contract auth-contract" >> $GITHUB_OUTPUT
            echo "ORDERED=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy modules
        run: |
          echo "🎯 Deploying to ${{ inputs.environment }}"
          echo "📦 Modules: ${{ steps.modules.outputs.MODULES }}"
          
          # Конфигурация для окружения
          if [ "${{ inputs.environment }}" = "production" ]; then
            MVN_ARGS="-Prelease"
            echo "🚀 Production deployment with signing"
          else
            MVN_ARGS=""
            echo "🔧 Staging deployment"
          fi
          
          # Разбиваем модули на массив
          IFS=' ' read -r -a MODULE_ARRAY <<< "${{ steps.modules.outputs.MODULES }}"
          
          for module in "${MODULE_ARRAY[@]}"; do
            if [ -d "$module" ]; then
              echo ""
              echo "========================================"
              echo "📦 Deploying $module"
              echo "========================================"
          
              cd "$module"
          
              # Получаем текущую версию
              VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
              echo "Version: $VERSION"
          
              # Деплоим
              mvn -B clean deploy -DskipTests $MVN_ARGS
          
              if [ $? -eq 0 ]; then
                echo "✅ $module v$VERSION deployed successfully!"
          
                # Создаём аннотацию в логах
                echo "::notice title=Deployed::$module v$VERSION to ${{ inputs.environment }}"
              else
                echo "❌ Failed to deploy $module"
                echo "::error title=Deployment Failed::$module deployment failed"
                exit 1
              fi
          
              cd ..
            else
              echo "⚠️  Module $module not found, skipping..."
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send notification
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              description: 'Contracts deployed successfully',
              context: 'contracts-deployment'
            });